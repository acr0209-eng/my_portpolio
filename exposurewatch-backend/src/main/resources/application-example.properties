spring.application.name=ExposureWatch
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/exposurewatch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=exposurewatch
spring.datasource.password=change-me
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.cors.allowed-origin=http://localhost:5173
app.admin.username=admin
app.admin.password=change-me
