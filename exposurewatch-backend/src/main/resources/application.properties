spring.application.name=ExposureWatch
server.port=8080

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/exposurewatch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:exposurewatch}
spring.datasource.password=${MYSQL_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-request-size=128KB
server.tomcat.max-http-form-post-size=128KB

app.cors.allowed-origin=${EXPOSUREWATCH_ALLOWED_ORIGIN:http://localhost:5173}
app.admin.username=${EXPOSUREWATCH_ADMIN_USERNAME:admin}
app.admin.password=${EXPOSUREWATCH_ADMIN_PASSWORD:change-me}
